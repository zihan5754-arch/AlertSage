[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alertsage"
version = "0.2.0"
description = "面向蓝队的可解释告警研判引擎：规则 + 行为基线 + 可选 LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zihan5754" }]
keywords = ["security", "soc", "blue-team", "alert-triage", "mitre-attack"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
alertsage = "alertsage.cli:main"

[project.urls]
Homepage = "https://github.com/zihan5754-arch/AlertSage"
Issues = "https://github.com/zihan5754-arch/AlertSage/issues"

[tool.setuptools.packages.find]
include = ["alertsage*"]

[tool.setuptools.package-data]
alertsage = ["rules/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
