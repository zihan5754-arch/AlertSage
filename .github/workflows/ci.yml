name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 单元测试 + 接口测试
        run: python -m unittest discover -s tests -t . -v

      - name: 规则完整性检查
        run: python -m alertsage rules --lint

      - name: 评估回归（准确率/F1 不得低于基线）
        run: python -m alertsage evaluate --min-accuracy 0.90 --min-f1 0.90

      - name: 数据集可复现（固定 seed，生成结果应与仓库一致）
        run: |
          python scripts/gen_dataset.py
          git diff --exit-code -- data/samples/labeled.jsonl

  package:
    name: 构建与安装校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: 安装并验证入口脚本
        run: |
          pip install dist/*.whl
          cd /tmp && alertsage rules --lint && alertsage demo

  lint:
    name: ruff（仅提示，不阻断）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.5"
      # 新项目先让 lint 跑起来当提示，等风格统一后再去掉 continue-on-error
      - run: ruff check alertsage tests --output-format=github
        continue-on-error: true
